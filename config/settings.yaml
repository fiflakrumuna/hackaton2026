# Ustawienia globalne odw2json.
# Wartości ${ZMIENNA:-domyślna} są czytane ze zmiennych środowiskowych (klucze API poza repo).

pipeline:
  # Osoba 1 podmienia na swój moduł z OCR, np. {class: ocr.engine:HybridExtractor, options: {...}}
  # pdf_ingest (Osoba 1) przez adapter; przy braku zależności OCR sam wraca do odw2json.text:PdfTextExtractor
  text_extractor:
    class: odw2json.ingest_adapter:PdfIngestExtractor
    options:
      max_pages: 6            # kluczowe dane są na pierwszych stronach

  # Osoba 2 może podpiąć klasyfikator LLM (np. jako fallback przy niskiej pewności)
  classifier:
    class: odw2json.classify:RuleClassifier
    options:
      head_chars: 3500
      use_filename: false       # UZP: "nie sugerujcie się nazwą pliku" – klasyfikacja tylko po treści

  # Kolejność = priorytet przy scalaniu (pierwsza niepusta wartość wygrywa,
  # chyba że pole w YAML ma `prefer: [...]`). Dopisz LLM na początku listy:
  #   - {class: llm.extractor:LLMExtractor, options: {model: "${LLM_MODEL:-bielik-11b}"}}
  # Reguły pierwsze (F1 0.993 na treningu), LLM uzupełnia pola, których reguły nie znalazły.
  # Bez LLM_BASE_URL/LLM_MODEL w .env ekstraktor LLM po prostu się pomija.
  extractors:
    - class: odw2json.extract_rules:RuleExtractor
    - class: odw2json.extract_llm:LLMExtractor

llm:                          # wspólne ustawienia dla modułu Osoby 2 (wartości z .env)
  base_url: ${LLM_BASE_URL:-}
  api_key: ${LLM_API_KEY:-}
  model: ${LLM_MODEL:-}
  temperature: 0
  timeout_s: 60

output:
  indent: 2
  negative: empty_file        # empty_file (wymóg README UZP) | empty_object
  audit_dir: null             # np. "audit" -> cytaty źródłowe i ostrzeżenia dla UI

evaluation:
  # nazwy plików w dane/ różnią się od nazw PDF: potwierdzenie_przelewu.pdf <-> przelew.json
  gt_to_pdf_stem:
    przelew: potwierdzenie_przelewu
  # jakie typy pliku GT oznaczają który typ dokumentu (do raportu per typ)
  gt_doc_type:
    odwolanie: odwolanie
    pelnomocnictwo: pelnomocnictwo
    przelew: przelew

# disabled_document_types: [przelew]   # szybkie wyłączenie typu bez kasowania pliku
